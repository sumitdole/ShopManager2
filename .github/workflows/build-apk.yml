name: Build ShopManager APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # --------------------------------------------------
      # 1. Get project
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python 3.14
      # --------------------------------------------------
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # --------------------------------------------------
      # 3. Java 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # --------------------------------------------------
      # 4. Linux dependencies
      # --------------------------------------------------
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev

      # --------------------------------------------------
      # 5. Install Buildozer + Python dependencies
      # --------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          python -m pip install legacy-cgi
          python -m pip install "Cython==0.29.34"
          python -m pip install git+https://github.com/kivy/buildozer.git

      # --------------------------------------------------
      # 6. Configure modern python-for-android
      # --------------------------------------------------
      - name: Configure Buildozer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          text = path.read_text()

          settings = {
              "p4a.branch": "develop",
              "android.api": "36",
              "android.ndk": "29",
              "android.minapi": "24",
              "android.archs": "arm64-v8a, armeabi-v7a",
              "android.accept_sdk_license": "True",
          }

          lines = text.splitlines()
          found = set()
          output = []

          for line in lines:
              stripped = line.strip()

              replaced = False

              for key, value in settings.items():
                  if stripped.startswith(key + " =") or stripped.startswith("#" + key + " ="):
                      output.append(f"{key} = {value}")
                      found.add(key)
                      replaced = True
                      break

              if not replaced:
                  output.append(line)

          for key, value in settings.items():
              if key not in found:
                  output.append(f"{key} = {value}")

          path.write_text("\n".join(output) + "\n")
          PY

          echo "========== BUILDZOER CONFIG =========="
          grep -E "p4a.branch|android.api|android.ndk|android.minapi|android.archs|android.accept_sdk_license" buildozer.spec || true
          echo "======================================"

      # --------------------------------------------------
      # 7. Prepare Android SDK / NDK / p4a
      # --------------------------------------------------
      - name: Prepare Android build environment
        run: |
          buildozer android p4a -- --help

      # --------------------------------------------------
      # 8. Build APK
      # --------------------------------------------------
      - name: Build APK
        run: |
          buildozer -v android debug

      # --------------------------------------------------
      # 9. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopManager-APK
          path: bin/*.apk
          if-no-files-found: error
