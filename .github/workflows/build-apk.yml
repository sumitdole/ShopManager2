name: Build ShopManager APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT PROJECT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON 3.11
      # IMPORTANT: DO NOT USE PYTHON 3.14
      # ============================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # ============================================================
      # 4. LINUX BUILD DEPENDENCIES
      # ============================================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev \
            gettext


      # ============================================================
      # 5. INSTALL PYTHON BUILD TOOLS
      # ============================================================
      - name: Install Buildozer and Cython
        run: |
          python --version
          python -m pip --version

          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          # Compatible Cython for Kivy 2.2.1 / p4a
          python -m pip install "Cython==0.29.34"

          # Buildozer
          python -m pip install "buildozer==1.5.0"

          # python-for-android
          python -m pip install "python-for-android"


      # ============================================================
      # 6. CHECK IMPORTANT VERSIONS
      # ============================================================
      - name: Check build environment
        run: |
          echo "======================================"
          echo "PYTHON"
          python --version

          echo "======================================"
          echo "PIP"
          python -m pip --version

          echo "======================================"
          echo "CYTHON"
          cython --version || true

          echo "======================================"
          echo "BUILDOZER"
          buildozer --version

          echo "======================================"
          echo "JAVA"
          java -version

          echo "======================================"


      # ============================================================
      # 7. SHOW PROJECT STRUCTURE
      # ============================================================
      - name: Check project structure
        run: |
          echo "========== PROJECT FILES =========="
          find . -maxdepth 3 -type f | sort
          echo "==================================="


      # ============================================================
      # 8. VERIFY BUILD CONFIG
      # ============================================================
      - name: Check buildozer.spec
        run: |
          echo "========== BUILDOZER SPEC =========="
          cat buildozer.spec
          echo "===================================="


      # ============================================================
      # 9. CLEAN OLD BUILDS
      # ============================================================
      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ============================================================
      # 10. ACCEPT ANDROID LICENSES
      # ============================================================
      - name: Accept Android licenses
        run: |
          mkdir -p "$HOME/.buildozer"

          yes | buildozer android debug 2>/dev/null || true

          echo "Android environment initialization complete."


      # ============================================================
      # 11. BUILD DEBUG APK
      # ============================================================
      - name: Build APK
        timeout-minutes: 45
        run: |
          yes | buildozer -v android debug


      # ============================================================
      # 12. SHOW GENERATED FILES
      # ============================================================
      - name: Find APK
        run: |
          echo "========== BUILD OUTPUT =========="

          if ls bin/*.apk 1> /dev/null 2>&1; then
              ls -lh bin/*.apk
              echo ""
              echo "APK BUILD SUCCESSFUL!"
          else
              echo ""
              echo "NO APK FOUND"
              echo ""
              echo "Searching entire project..."
              find . -type f \( -name "*.apk" -o -name "*.aab" \) -print
              exit 1
          fi

          echo "=================================="


      # ============================================================
      # 13. UPLOAD APK TO GITHUB
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopManager-APK
          path: bin/*.apk
          if-no-files-found: error
