name: Build ShopManager APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON 3.11
      # ============================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # ============================================================
      # 4. LINUX DEPENDENCIES
      # ============================================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev \
            gettext


      # ============================================================
      # 5. INSTALL MODERN BUILDOZER
      # ============================================================
      - name: Install Buildozer
        run: |
          python --version

          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install legacy-cgi
          python -m pip install "Cython==0.29.34"

          # IMPORTANT:
          # Do NOT install buildozer==1.5.0
          python -m pip install git+https://github.com/kivy/buildozer.git


      # ============================================================
      # 6. INSTALL PYTHON-FOR-ANDROID DEVELOP
      # ============================================================
      - name: Install python-for-android
        run: |
          python -m pip install \
            git+https://github.com/kivy/python-for-android.git@develop


      # ============================================================
      # 7. VERIFY ENVIRONMENT
      # ============================================================
      - name: Verify environment
        run: |
          echo "=============================="
          echo "PYTHON"
          python --version

          echo "=============================="
          echo "BUILDOZER"
          buildozer --version

          echo "=============================="
          echo "CYTHON"
          cython --version

          echo "=============================="
          echo "P4A"
          python -m pythonforandroid.toolchain --help > /dev/null
          echo "python-for-android OK"

          echo "=============================="
          echo "JAVA"
          java -version

          echo "=============================="


      # ============================================================
      # 8. CHECK PROJECT
      # ============================================================
      - name: Check project structure
        run: |
          echo "========== PROJECT =========="
          find . -maxdepth 3 -type f | sort
          echo "============================="


      # ============================================================
      # 9. SHOW BUILDOZER SETTINGS
      # ============================================================
      - name: Check Buildozer configuration
        run: |
          echo "========== REQUIREMENTS =========="
          grep -n "^requirements" buildozer.spec || true

          echo ""
          echo "========== ANDROID SETTINGS =========="
          grep -E \
            "p4a.branch|android.api|android.ndk|android.minapi|android.archs" \
            buildozer.spec || true

          echo "======================================"


      # ============================================================
      # 10. CLEAN OLD BUILD
      # ============================================================
      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ============================================================
      # 11. BUILD APK
      # ============================================================
      - name: Build Android APK
        timeout-minutes: 60
        run: |
          yes | buildozer -v android debug


      # ============================================================
      # 12. FIND APK
      # ============================================================
      - name: Check APK
        run: |
          echo "========== APK FILES =========="

          find . -type f -name "*.apk" -print

          if ls bin/*.apk 1>/dev/null 2>&1; then
            echo ""
            echo "================================"
            echo "       APK BUILD SUCCESS"
            echo "================================"
            ls -lh bin/*.apk
          else
            echo ""
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi


      # ============================================================
      # 13. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopManager-APK
          path: bin/*.apk
          if-no-files-found: error
