name: Build ShopManager APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON 3.14
      # Current python-for-android requires the modern Python stack
      # ============================================================
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      # ============================================================
      # 3. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. LINUX DEPENDENCIES
      # ============================================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev \
            gettext


      # ============================================================
      # 5. INSTALL BUILDOZER
      # ============================================================
      - name: Install Buildozer
        run: |
          python --version

          python -m pip install --upgrade pip

          python -m pip install \
            setuptools \
            wheel \
            build

          python -m pip install \
            "buildozer==1.5.0"


      # ============================================================
      # 6. INSTALL CURRENT PYTHON-FOR-ANDROID
      # ============================================================
      - name: Install python-for-android
        run: |
          python -m pip install \
            "python-for-android==2026.5.9"


      # ============================================================
      # 7. VERIFY TOOLS
      # ============================================================
      - name: Verify build environment
        run: |
          echo "================================"
          echo "Python:"
          python --version

          echo "================================"
          echo "Buildozer:"
          buildozer --version

          echo "================================"
          echo "python-for-android:"
          python -m pythonforandroid.toolchain --version || true

          echo "================================"
          echo "Java:"
          java -version

          echo "================================"


      # ============================================================
      # 8. CHECK PROJECT
      # ============================================================
      - name: Check project structure
        run: |
          echo "========== PROJECT =========="

          find . -maxdepth 3 -type f | sort

          echo "============================="


      # ============================================================
      # 9. VERIFY REQUIREMENTS
      # ============================================================
      - name: Verify Buildozer requirements
        run: |
          echo "========== REQUIREMENTS =========="

          grep -n "^requirements" buildozer.spec || true

          echo "=================================="


      # ============================================================
      # 10. CLEAN PREVIOUS BUILD
      # ============================================================
      - name: Clean previous Buildozer build
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ============================================================
      # 11. BUILD APK
      # ============================================================
      - name: Build Android APK
        timeout-minutes: 60
        run: |
          yes | buildozer -v android debug


      # ============================================================
      # 12. CHECK APK
      # ============================================================
      - name: Check APK output
        run: |
          echo "========== APK OUTPUT =========="

          find . -type f -name "*.apk" -print

          if ls bin/*.apk 1> /dev/null 2>&1; then
            echo ""
            echo "================================"
            echo "      APK BUILD SUCCESSFUL"
            echo "================================"
            ls -lh bin/*.apk
          else
            echo ""
            echo "NO APK WAS CREATED"
            echo ""
            echo "Last build files:"
            find .buildozer -type f \
              \( -name "*.log" -o -name "*.apk" \) \
              -print | tail -50

            exit 1
          fi


      # ============================================================
      # 13. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopManager-APK
          path: bin/*.apk
          if-no-files-found: error
